    <script type="module" src="js/units.js"></script>
    <script type="module" src="js/addNewLaneToTree.js"></script>

<body>
    <!-- <div id="container"> -->
    <div id="wrapper">
        <div id="major_god_selection_panel__sticky">
            <div id="major_god_selection_panel__sticky__inner"></div>
        </div>
            <div id="side_panel">
                <div id="side_panel__major_god_description">
                    <div id="side_panel__major_god_description__headings"></div>

                    <div id="side_panel__major_god_description__bonus-details"></div>

                <div id="side_panel__minor_gods">

                        <div id="helptext_SP">
                            <div id="helptext__content_SP"></div>

                            <summary>Advanced Stats</summary>
                            <div id="helptext__advanced_stats_SP"></div>
                            <div id="helptext__x_ref_SP">

                                <div id="helptext__x_ref__container_SP"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        <div id="techtree">
            <div id="helptext">
                <div id="helptext__content"></div>
                <details>
                <summary>Advanced Stats</summary>
                <div id="helptext__advanced_stats"></div>
                <div id="helptext__x_ref">
                    <h3>Civilizations</h3>
                    <div id="helptext__x_ref__container"></div>

            </div>
